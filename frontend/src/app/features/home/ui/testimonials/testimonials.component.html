<div class="bg-deco alt" data-parallax="0.1" aria-hidden="true"></div><div class="container">
  <div class="section-head"><div><span class="kicker">Reviews</span><h2>Loved by travellers</h2><p>4.6 average from 7,000+ verified trips</p></div><div class="row"><button class="icon-btn" id="tprev" aria-label="Previous review" (click)="step(-1)"><svg ybIcon="chevL"></svg></button><button class="icon-btn" id="tnext" aria-label="Next review" (click)="step(1)"><svg ybIcon="chevR"></svg></button></div></div>
  <div class="testi-wrap" aria-roledescription="carousel" (mouseenter)="pause()" (mouseleave)="restart()"><div class="testi-track" id="ttrack" [style.transform]="transform()" (touchstart)="touchStart($event)" (touchend)="touchEnd($event)">@for (t of items; track t.name; let i = $index) {<figure class="testi" aria-roledescription="slide" [attr.aria-label]="(i + 1) + ' of ' + items.length"><div class="stars" aria-label="5 out of 5">@for (s of [1, 2, 3, 4, 5]; track s) {<svg ybIcon="star2"></svg>}</div><blockquote>“{{ t.quote }}”</blockquote><figcaption><span class="avatar">{{ t.name | initials }}</span><span><b>{{ t.name }}</b><span class="tiny muted">{{ t.route }}</span></span></figcaption></figure>}</div></div>
  <div class="dots" id="tdots" role="tablist">@for (t of items; track t.name; let i = $index) {<button role="tab" [attr.aria-label]="'Show review ' + (i + 1)" [attr.data-dot]="i" [attr.aria-selected]="i === index()" [hidden]="i > max()" (click)="pick(i)"></button>}</div>
</div>
